name: Build Suoro Executables (Windows .exe + Android .apk)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Flutter Doctor
        run: flutter doctor -v
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Scaffold Platform Project
        shell: bash
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak
          flutter create . --project-name suoro --platforms=windows --org com.suoro
          cp pubspec.yaml.bak pubspec.yaml
          cp -r lib.bak/* lib/
          rm -rf lib.bak pubspec.yaml.bak
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows Executable
        run: flutter build windows --release --verbose
      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suoro-Windows-exe
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android .apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" || true
      - name: Scaffold Platform Project
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak
          flutter create . --project-name suoro --platforms=android --org com.suoro
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          cp pubspec.yaml.bak pubspec.yaml
          cp -r lib.bak/* lib/
          rm -rf lib.bak pubspec.yaml.bak
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x checkDebugAarMetadata || ./gradlew assembleDebug
          cd ..
      - name: Upload Android .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suoro-Android-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
