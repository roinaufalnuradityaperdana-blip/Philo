name: Build Suoro Executables (Windows .exe + Android .apk)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Scaffold Platform Project
        run: flutter create . --platforms=windows --org com.suoro
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows Executable
        run: flutter build windows --release
      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suoro-Windows-exe
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android .apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'
      - name: Scaffold Platform Project
        run: flutter create . --platforms=android --org com.suoro
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload Android .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suoro-Android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
